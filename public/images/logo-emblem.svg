<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Yellow Rounded Background Badge -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="#FFC800" stroke="#1C1917" stroke-width="3" filter="url(#badgeShadow)"/>
  
  <!-- Coffee Cup Silhouette -->
  <path d="M 28 32 L 72 32 L 66 68 C 66 73 59 78 50 78 C 41 78 34 73 34 68 Z" fill="#1C1917"/>
  <!-- Cup Handle -->
  <path d="M 69 40 C 76 40 81 44 81 51 C 81 58 75 62 68 62" fill="none" stroke="#1C1917" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Steam Waves -->
  <path d="M 40 22 Q 43 16 40 10" fill="none" stroke="#1C1917" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 25 Q 53 18 50 12" fill="none" stroke="#1C1917" stroke-width="3" stroke-linecap="round"/>
  <path d="M 60 22 Q 63 16 60 10" fill="none" stroke="#1C1917" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Inner "MGC" Text inside Cup -->
  <text x="50" y="60" font-family="'Pretendard', 'Inter', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFC800" text-anchor="middle" letter-spacing="1">MGC</text>
</svg>
